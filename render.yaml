# Despliegue en Render (https://render.com) con "New > Blueprint" apuntando a este repositorio.
# Crea: base PostgreSQL, API Flask y la web React como sitio estático.
databases:
  - name: gotrain-db
    plan: free
    databaseName: gotrain
    user: gotrain

services:
  - type: web
    name: gotrain-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py --si-vacia && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: gotrain-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # opcional: pegala en el panel de Render para usar Claude real
      - key: CLAUDE_MODEL
        value: claude-opus-5-5

  - type: web
    name: gotrain-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gotrain-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
